<div>
  <label for="email1" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
    >Correo electrónico</label
  >
  <input
    pInputText
    id="email1"
    type="text"
    placeholder="Correo electrónico"
    class="w-full md:w-120 mb-8"
    [(ngModel)]="email"
  />

  <label for="password1" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2"
    >Contraseña</label
  >
  <p-password
    id="password1"
    [(ngModel)]="password"
    placeholder="Contraseña"
    [toggleMask]="true"
    styleClass="mb-4"
    [fluid]="true"
    [feedback]="false"
  ></p-password>

  <div class="flex items-center justify-between mt-2 mb-8 gap-8">
    <a
      routerLink="/auth/sign-up"
      class="font-medium no-underline ml-2 text-right cursor-pointer text-primary"
      >No tienes una cuenta?</a
    >
    <span class="font-medium no-underline ml-2 text-right cursor-pointer text-primary"
      >Olvido su contraseña?</span
    >
  </div>
  <p-button
    label="Iniciar sesión"
    styleClass="w-full"
    [loading]="loading"
    [disabled]="loading"
    (onClick)="onSubmit()"
  ></p-button>
</div>
