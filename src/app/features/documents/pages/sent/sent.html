<div class="card p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold m-0">Documentos Enviados</h2>
    <span class="relative">
      <i
        class="pi pi-search absolute top-2/4 -mt-2 left-3 text-surface-400 dark:text-surface-600"
      ></i>
      <input
        pInputText
        type="text"
        (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        placeholder="Buscar..."
        class="pl-10 p-inputtext-sm"
      />
    </span>
  </div>

  <p-table
    #dt
    [value]="documents"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    responsiveLayout="scroll"
    [globalFilterFields]="['title', 'subject', 'recipient', 'id']"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id" class="w-32">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="title">Título <p-sortIcon field="title"></p-sortIcon></th>
        <th pSortableColumn="subject">Asunto <p-sortIcon field="subject"></p-sortIcon></th>
        <th pSortableColumn="recipient">
          Destinatario <p-sortIcon field="recipient"></p-sortIcon>
        </th>
        <th pSortableColumn="date" class="w-32">Fecha <p-sortIcon field="date"></p-sortIcon></th>
        <th class="w-24">Estado</th>
        <th class="w-24">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-doc>
      <tr>
        <td>
          <span class="font-semibold">{{ doc.id }}</span>
        </td>
        <td>{{ doc.title }}</td>
        <td>{{ doc.subject }}</td>
        <td>{{ doc.recipient }}</td>
        <td>{{ doc.date | date : 'shortDate' }}</td>
        <td><p-tag [value]="doc.status" [severity]="getSeverity(doc.status)"></p-tag></td>
        <td>
          <button
            pButton
            icon="pi pi-eye"
            class="p-button-text p-button-secondary mr-2"
            pTooltip="Ver documento"
          ></button>
          <button
            pButton
            icon="pi pi-download"
            class="p-button-text p-button-info"
            pTooltip="Descargar"
            *ngIf="doc.hasAttachments"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center p-4">No has enviado documentos todavía.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
